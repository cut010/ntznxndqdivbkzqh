<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #v { width: 100%; height: 100%; background: #000; object-fit: contain; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         color: #ccc; font: 14px system-ui, sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<video id="v" controls playsinline webkit-playsinline autoplay></video>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
  (function () {
    var v = document.getElementById('v');
    var msg = document.getElementById('msg');
    var src = 'master.m3u8';
    function fail(t) { msg.textContent = t; msg.style.display = 'flex'; }

    if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = src;
    } else if (window.Hls && window.Hls.isSupported()) {
      var hls = new Hls({ maxBufferLength: 30 });
      hls.loadSource(src);
      hls.attachMedia(v);
      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else fail('No se pudo reproducir el vídeo.');
        }
      });
    } else {
      v.src = src;
    }
  })();
</script>
</body>
</html>
